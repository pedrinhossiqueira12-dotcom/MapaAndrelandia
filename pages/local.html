<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>Carregando...</title>

<meta
name="theme-color"
content="#5e4426">

<meta
name="description"
content="Guia Turístico de Andrelândia">

<link
rel="icon"
href="../favicon.ico">

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<link
rel="stylesheet"
href="../css/style.css">

<link
rel="stylesheet"
href="../css/local.css">

</head>

<body class="pagina-local">

<!-- ===================================================== -->
<!-- CAPA -->
<!-- ===================================================== -->

<header id="hero">

    <img
        id="heroImagem"
        src="../img/interface/sem-foto.webp"
        alt="">

    <div id="heroGradient"></div>

    <button
        id="btnVoltar"
        class="heroButton">

        ←

    </button>

    <button
        id="btnCompartilhar"
        class="heroButton">

        ⤴

    </button>

</header>

<!-- ===================================================== -->
<!-- CONTEÚDO -->
<!-- ===================================================== -->

<main id="conteudo">

<section id="cabecalho">

<span id="categoria"></span>

<h1 id="titulo"></h1>

<div id="avaliacao">

<span id="nota"></span>

</div>

</section>

<!-- ===================================================== -->

<section class="card">

<h2>

História

</h2>

<p id="historia"></p>

</section>

<!-- ===================================================== -->

<section class="card">

<h2>

Curiosidades

</h2>

<p id="curiosidades"></p>

</section>

<!-- ===================================================== -->

<section class="card">

<h2>

Informações

</h2>

<div class="infoLinha">

<strong>

Endereço

</strong>

<span id="endereco"></span>

</div>

<div class="infoLinha">

<strong>

Tempo médio

</strong>

<span id="tempo"></span>

</div>

</section>

<!-- ===================================================== -->

<section class="card">

<h2>

Galeria

</h2>

<div id="galeria"></div>

</section>

<!-- ===================================================== -->

<section class="card">

<h2>

Localização

</h2>

<div id="mapaLocal"></div>

</section>

</main>

<!-- ===================================================== -->
<!-- RODAPÉ FIXO -->
<!-- ===================================================== -->

<footer id="acoes">

<button id="btnComoChegar">

Como chegar

</button>

</footer>

<!-- ===================================================== -->
<!-- LIGHTBOX -->
<!-- ===================================================== -->

<div id="lightbox">

<img
id="lightboxImagem"
src=""
alt="">

</div>

<!-- ===================================================== -->
<!-- SCRIPTS -->
<!-- ===================================================== -->

<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<script src="../data/locais.js"></script>

<script src="../js/util.js"></script>

<script src="../js/local.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Mapa Interativo • Andrelândia MG</title>

    <meta name="theme-color" content="#111111">

    <link rel="icon" href="img/interface/favicon.png">

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- ========================================================= -->
    <!-- MAPA -->
    <!-- ========================================================= -->

    <div id="map"></div>

    <!-- ========================================================= -->
    <!-- SVG FIXO (HUD) -->
    <!-- ========================================================= -->

    <div id="hud">

        <img
            id="hud-svg"
            src="img/interface/hud.svg"
            alt="HUD">

    </div>

    <!-- ========================================================= -->
    <!-- PAINEL SUPERIOR -->
    <!-- ========================================================= -->

    <div id="topbar">

        <button id="btnMenu" class="map-btn" title="Menu">

            ☰

        </button>

        <div id="searchContainer">

            <button id="btnSearch" class="map-btn">

                🔍

            </button>

            <input
                type="text"
                id="searchInput"
                placeholder="Pesquisar...">

        </div>

    </div>

    <!-- ========================================================= -->
    <!-- PAINEL DIREITO -->
    <!-- ========================================================= -->

    <div id="rightControls">

        <button id="btnLocate" class="map-btn" title="Minha localização">

            📍

        </button>

        <button id="btnLayers" class="map-btn" title="Camadas">

            🎨

        </button>

        <button id="btnSatellite" class="map-btn" title="Satélite">

            🛰

        </button>

    </div>

    <!-- ========================================================= -->
    <!-- MENU LATERAL -->
    <!-- ========================================================= -->

    <aside id="sidebar">

        <div class="sidebar-header">

            <h2>Filtros</h2>

            <button id="btnCloseSidebar">

                ✕

            </button>

        </div>

        <div id="sidebarContent">

            <!-- Preenchido via JavaScript -->

        </div>

    </aside>

    <!-- ========================================================= -->
    <!-- OVERLAY -->
    <!-- ========================================================= -->

    <div id="overlay"></div>
<!-- ========================================================= -->
<!-- PAINEL INFERIOR -->
<!-- ========================================================= -->

<section id="bottomSheet">

    <div id="sheetHandle"></div>

    <div id="sheetImagem">

        <img
            id="sheetFoto"
            src="img/interface/sem-foto.webp"
            alt="Foto">

    </div>

    <div id="sheetConteudo">

        <span id="sheetCategoria"></span>

        <h2 id="sheetTitulo"></h2>

        <p id="sheetDescricao"></p>

        <div id="sheetBotoes">

            <button id="btnDetalhes">

                Ver detalhes

            </button>

            <button id="btnRota">

                Como chegar

            </button>

        </div>

    </div>

</section>
    <!-- ========================================================= -->
    <!-- LEAFLET -->
    <!-- ========================================================= -->

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- ========================================================= -->
    <!-- MÓDULOS -->
    <!-- ========================================================= -->

    <script src="js/app.js"></script>

    <script src="js/mapa.js"></script>

    <script src="js/gps.js"></script>

    <script src="js/marcadores.js"></script>

    <script src="js/popup.js"></script>

    <script src="js/pesquisa.js"></script>

    <script src="js/filtros.js"></script>

    <script src="js/camadas.js"></script>

    <script src="js/interface.js"></script>

</body>

</html>

<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,initial-scale=1.0,viewport-fit=cover">

    <title>Mapa Interativo de Andrelândia</title>

    <meta
        name="theme-color"
        content="#5e4426">

    <meta
        name="description"
        content="Mapa Interativo de Andrelândia">

    <link
        rel="icon"
        href="favicon.ico">

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <link
        rel="stylesheet"
        href="css/style.css">

</head>

<body class="modo-pergaminho">

    <!-- ===================================================== -->
    <!-- MAPA -->
    <!-- ===================================================== -->

    <div id="map"></div>

    <!-- ===================================================== -->
    <!-- HUD FIXO -->
    <!-- ===================================================== -->

    <div id="hud">

        <img

            id="hudOverlay"

            src="img/interface/hud.svg"

            alt="HUD">

    </div>

    <!-- ===================================================== -->
    <!-- PESQUISA -->
    <!-- ===================================================== -->

    <div id="searchContainer">

        <button

            id="btnPesquisar"

            class="botao-flutuante"

            aria-label="Pesquisar">

            <img

                src="img/interface/pesquisa.svg"

                alt="Pesquisar">

        </button>

        <div id="searchBox">

            <input

                id="searchInput"

                type="text"

                placeholder="Pesquisar...">

        </div>

    </div>

    <!-- ===================================================== -->
    <!-- MENU DIREITO -->
    <!-- ===================================================== -->

    <div id="menuDireito">

        <button

            id="btnSatellite"

            class="botao-flutuante"

            aria-label="Alternar modo">

            <img

                src="img/interface/satelite.svg"

                alt="Modo">

        </button>

        <button

            id="btnGPS"

            class="botao-flutuante"

            aria-label="Minha localização">

            <img

                src="img/interface/gps.svg"

                alt="GPS">

        </button>

        <button

            id="btnMenu"

            class="botao-flutuante"

            aria-label="Menu">

            <img

                src="img/interface/menu.svg"

                alt="Menu">

        </button>

    </div>
        <!-- ===================================================== -->
    <!-- MENU LATERAL -->
    <!-- ===================================================== -->

    <aside id="menuLateral">

        <div id="menuCabecalho">

            <h2 id="menuTitulo">

                Filtros

            </h2>

        </div>

        <div id="menuConteudo">

            <div class="grupoFiltro">

                <h3>

                    Exibir

                </h3>

                <div class="itemFiltro">

                    <span>

                        Pontos Turísticos

                    </span>

                    <label class="switch">

                        <input

                            id="toggleTurismo"

                            type="checkbox"

                            checked>

                        <span class="slider"></span>

                    </label>

                </div>

                <div class="itemFiltro">

                    <span>

                        Comércios

                    </span>

                    <label class="switch">

                        <input

                            id="toggleComercios"

                            type="checkbox"

                            checked>

                        <span class="slider"></span>

                    </label>

                </div>

            </div>

            <div

                id="categoriasContainer"

                class="grupoFiltro">

                <h3>

                    Categorias

                </h3>

            </div>

        </div>

        <button id="fecharMenu">

            Fechar

        </button>

    </aside>

    <!-- ===================================================== -->
    <!-- PAINEL INFERIOR -->
    <!-- ===================================================== -->

    <section id="bottomSheet">

        <div id="sheetHandle"></div>

        <div id="sheetImagem">

            <img

                id="sheetFoto"

                src="img/interface/sem-foto.webp"

                alt="Foto">

        </div>

        <div id="sheetConteudo">

            <span id="sheetCategoria"></span>

            <h2 id="sheetTitulo"></h2>

            <p id="sheetDescricao"></p>

            <div id="sheetBotoes">

                <button id="btnDetalhes">

                    Ver detalhes

                </button>

                <button id="btnRota">

                    Como chegar

                </button>

            </div>

        </div>

    </section>
        <!-- ===================================================== -->
    <!-- SCRIPTS EXTERNOS -->
    <!-- ===================================================== -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>

    <!-- ===================================================== -->
    <!-- DADOS -->
    <!-- ===================================================== -->

    <script src="data/locais.js"></script>

    <script src="data/comercios.js"></script>

    <!-- ===================================================== -->
    <!-- CONFIGURAÇÃO -->
    <!-- ===================================================== -->

    <script src="js/config.js"></script>

    <script src="js/util.js"></script>

    <!-- ===================================================== -->
    <!-- MÓDULOS -->
    <!-- ===================================================== -->

    <script src="js/mapa.js"></script>

    <script src="js/gps.js"></script>

    <script src="js/marcadores.js"></script>

    <script src="js/popup.js"></script>

    <script src="js/pesquisa.js"></script>

    <script src="js/filtros.js"></script>

    <script src="js/camadas.js"></script>

    <script src="js/app.js"></script>
        <script>

        document.addEventListener(

            "DOMContentLoaded",

            ()=>{

                iniciarAplicacao();

            }

        );

    </script>

</body>

</html>
